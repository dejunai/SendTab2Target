<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Targets — Open in Target</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; max-width: 900px; margin: 0 auto; }
    .target { margin-bottom: 16px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; }
    label { display:block; font-size: 12px; color: #555; font-weight: bold; margin-top: 8px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; margin: 4px 0 8px; border: 1px solid #ddd; border-radius: 3px; }
    input[type=text]:focus { outline: none; border-color: #0078d4; box-shadow: 0 0 3px rgba(0,120,212,0.3); }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input { flex: 1; }
    button { padding: 6px 12px; margin-right: 8px; background: #0078d4; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; }
    button:hover { background: #005a9e; }
    button:active { background: #004578; }
    button.test { background: #107c10; }
    button.test:hover { background: #0d5e0f; }
    button.secondary { background: #6c757d; }
    button.secondary:hover { background: #5a6268; }
    #status { margin-top: 16px; padding: 8px; border-radius: 3px; }
    .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <h2>Manage Targets (max 6)</h2>
  <p>Set display names and browser paths for your targets. Use the Test button to verify a target works.</p>
  <div id="targets"></div>
  <div id="status" style="display:none;"></div>
  <div style="margin-top:16px;">
    <button id="save">Save</button>
    <button id="restore" class="secondary">Restore Defaults</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
